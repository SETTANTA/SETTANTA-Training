<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SETTANTA Training</title>
<meta name="theme-color" content="#f5f4f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css?v=3.0.0">
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="34" height="34"><span>SETTANTA<br>TRAINING</span></div>
    <button id="weekBadge" class="week" type="button"></button>
  </header>
  <nav class="tabs" role="tablist">
    <button type="button" data-view="oggi" class="on">Allenamento</button>
    <button type="button" data-view="storico">Storico</button>
    <button type="button" data-view="impostazioni">Impostazioni</button>
  </nav>
  <main id="view"></main>
</div>

<div id="timer" class="timer" aria-live="polite">
  <div class="timer-bar"><i id="timerFill"></i></div>
  <div class="timer-row">
    <div class="timer-txt">
      <div id="timerLabel" class="timer-label">RECUPERO</div>
      <div id="timerTime" class="timer-time">00:00</div>
      <div id="timerNext" class="timer-next"></div>
    </div>
    <div class="timer-btns">
      <button type="button" data-t="-15">−15</button>
      <button type="button" data-t="15">+15</button>
      <button type="button" data-t="stop" class="lime">Salta</button>
    </div>
  </div>
</div>

<script src="app.js?v=3.0.0"></script>
</body>
</html>
